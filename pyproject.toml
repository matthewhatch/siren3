[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "siren-mapper"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.9"]
hardware = ["python-can==4.6.1"]

[project.scripts]
siren-mapper = "siren_mapper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["vcan: explicit opt-in SocketCAN integration test on verified vcan only"]

[tool.ruff]
line-length = 100
